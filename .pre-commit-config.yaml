repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --source . --staged --no-banner --redact
        language: system
        pass_filenames: false
