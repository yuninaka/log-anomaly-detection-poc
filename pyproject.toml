[project]
name = "log-anomaly-detection-poc"
version = "0.1.0"
description = "AIが生ログ・実データに一切触れず、メタデータのみで異常の絞り込みを行うことを実装レベルで検証するPoC"
authors = [
    { name = "Yunin", email = "yuninakamura2023@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.13.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "vulture",
    "pip-audit",
    "pre-commit",
    "pandas-stubs>=3.0.5.260730",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "PLR", "N", "B", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12

[tool.mypy]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# tests/type_fixtures/・tests/root_cause_type_fixtures/ は意図的に型エラーを
# 含むfixture(Step3・Step7の型分離が崩れていないことをtest_type_separation.py・
# test_root_cause_type_separation.pyがmypyのsubprocess実行で検証するためのもの)。
# 通常のCI用mypy実行(mypy src tests)からは除外する。
exclude = ["tests/type_fixtures/", "tests/root_cause_type_fixtures/"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
